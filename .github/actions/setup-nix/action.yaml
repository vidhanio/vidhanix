name: Set Up Nix
description: Install Nix and prepare the runner for a Nix job

inputs:
  ssh-private-key:
    description: SSH key for private flake inputs
    required: true
  netrc:
    description: Netrc contents for authenticated fetches
    required: false
    default: ""
  cachix-auth-token:
    description: Token for pushing build outputs to Cachix
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set Up SSH Agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - name: Set Up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Free Disk Space
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: carve
    - name: Set Up Netrc
      if: inputs.netrc != ''
      shell: bash
      env:
        NETRC: ${{ inputs.netrc }}
      run: |
        umask 077
        printf '%s\n' "$NETRC" > "$RUNNER_TEMP/netrc"
        sudo mkdir -p /etc/determinate
        sudo tee /etc/determinate/config.json >/dev/null <<EOF
        {
          "authentication": {
            "additionalNetrcSources": ["$RUNNER_TEMP/netrc"]
          }
        }
        EOF
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: |
          nix-path = nixpkgs=channel:nixos-unstable
          build-dir = /nix/build
          accept-flake-config = true
          extra-platforms = x86_64-linux aarch64-linux i686-linux
    - name: Set Up Cachix
      uses: cachix/cachix-action@v17
      with:
        name: vidhanio
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-auth-token == '' }}
        pushFilter: ((\.(tar\.gz|tar\.xz|tgz|deb)|-source(-patched)?)$|berkeley-mono|pragmata-pro|rex)
