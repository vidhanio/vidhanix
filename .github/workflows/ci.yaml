name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  generate-matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
      - name: Generate Build Matrix
        id: matrix
        run: echo "builds=$(nix eval --json .#githubActionsMatrix)" >> "$GITHUB_OUTPUT"

  build:
    name: >-
      ${{ format('{0} ({1}): {2}', case(
        matrix.type == 'package', 'Build Package',
        matrix.type == 'system', 'Build System',
        matrix.type == 'devshell', 'Build Dev Shell',
        matrix.type == 'check', 'Run Flake Check',
        null
      ), matrix.system, matrix.name) }}
    needs: generate-matrix
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    concurrency:
      group: ${{ format('nix-{0}-{1}-{2}', matrix.type, matrix.system, matrix.name) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Build
        env:
          ATTR: >-
            ${{ case(
              matrix.type == 'package', format('packages.{0}."{1}"', matrix.system, matrix.name),
              matrix.type == 'system', format('nixosConfigurations."{0}".config.system.build.toplevel', matrix.name),
              matrix.type == 'devshell', format('devShells.{0}."{1}"', matrix.system, matrix.name),
              matrix.type == 'check', format('checks.{0}."{1}"', matrix.system, matrix.name),
              null
            ) }}
        run: nix build ".#$ATTR" --print-build-logs
