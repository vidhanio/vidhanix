name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  generate-matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
      - name: Generate Build Matrix
        id: matrix
        run: |
          # shellcheck disable=SC2016
          builds=$(nix eval --json --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              systems = [ "aarch64-linux" "x86_64-linux" ];
              packages = builtins.concatLists (map (system:
                let
                  supported = builtins.filter (pkg:
                    builtins.elem system (flake.packages.${system}.${pkg}.meta.platforms or [])
                  ) (builtins.attrNames flake.packages.${system});
                in map (pkg: {
                  inherit system;
                  name = pkg;
                  type = "Package";
                }) supported
              ) systems);
              hosts = map (name: {
                inherit name;
                system = flake.nixosConfigurations.${name}.config.nixpkgs.hostPlatform.system;
                type = "System";
              }) (builtins.attrNames flake.nixosConfigurations);
              shells = builtins.concatLists (map (system:
                map (name: {
                  inherit name system;
                  type = "Dev Shell";
                }) (builtins.attrNames flake.devShells.${system})
              ) systems);
            in {
              include = packages ++ hosts ++ shells;
            }
          ')
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  check-flake:
    name: Check Flake (${{ matrix.system }})
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-linux
          - x86_64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check Flake
        run: nix flake check --print-build-logs

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check Formatting
        run: nix develop -c just fmt --ci

  check-generated-files:
    name: Check Generated Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Generate Files
        run: nix develop -c just generate
      - name: Check Diff
        run: git diff --exit-code

  build:
    name: "Build ${{ matrix.type }} (${{ matrix.system }}): ${{ matrix.name }}"
    needs: generate-matrix
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    concurrency:
      group: ${{ format('nix-{0}-{1}-{2}', matrix.type, matrix.system, matrix.name) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Build ${{ matrix.type }}
        env:
          TYPE: ${{ matrix.type }}
          SYSTEM: ${{ matrix.system }}
          NAME: ${{ matrix.name }}
        run: |
          case "$TYPE" in
            Package) attr="packages.$SYSTEM.$NAME" ;;
            System) attr="nixosConfigurations.$NAME.config.system.build.toplevel" ;;
            "Dev Shell") attr="devShells.$SYSTEM.$NAME" ;;
            *) echo "Unknown build type: $TYPE" >&2; exit 1 ;;
          esac
          nix build ".#$attr" --print-build-logs
