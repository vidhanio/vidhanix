name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  generate-matrices:
    name: Generate Build Matrices
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrices.outputs.packages }}
      systems: ${{ steps.matrices.outputs.systems }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
      - name: Generate Build Matrices
        id: matrices
        run: |
          # shellcheck disable=SC2016
          packages=$(nix eval --json .#packages --apply '
            packages: {
              include = builtins.concatLists (map (system:
                let
                  supported = builtins.filter (pkg:
                    builtins.elem system (packages.${system}.${pkg}.meta.platforms or [])
                  ) (builtins.attrNames packages.${system});
                in map (pkg: { inherit pkg system; }) supported
              ) [ "aarch64-linux" "x86_64-linux" ]);
            }
          ')
          # shellcheck disable=SC2016
          systems=$(nix eval --json .#nixosConfigurations --apply '
            hosts: {
              include = map (name: {
                inherit name;
                system = hosts.${name}.config.nixpkgs.hostPlatform.system;
                attr = "nixosConfigurations.${name}.config.system.build.toplevel";
              }) (builtins.attrNames hosts);
            }
          ')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "systems=$systems" >> "$GITHUB_OUTPUT"

  check-flake:
    name: Check Flake (${{ matrix.system }})
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-linux
          - x86_64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check Flake
        run: nix flake check --print-build-logs

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check Formatting
        run: nix develop -c just fmt --ci

  check-generated-files:
    name: Check Generated Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Generate Files
        run: nix develop -c just generate
      - name: Check Diff
        run: git diff --exit-code

  build-devshell:
    name: Build Dev Shell (${{ matrix.system }})
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-linux
          - x86_64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Build Dev Shell
        run: nix build .#devShells.${{ matrix.system }}.default --print-build-logs

  build-packages:
    name: "Build Package (${{ matrix.system }}): ${{ matrix.pkg }}"
    needs: generate-matrices
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    concurrency:
      group: ${{ format('nix-{0}-{1}', matrix.pkg, matrix.system) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrices.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Build Package
        run: nix build .#${{ matrix.pkg }} --print-build-logs

  build-systems:
    name: "Build System (${{ matrix.system }}): ${{ matrix.name }}"
    needs: generate-matrices
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    concurrency:
      group: ${{ format('nix-{0}', matrix.name) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrices.outputs.systems) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Build System
        run: nix build .#${{ matrix.attr }} --print-build-logs
