name: Sync Dependabot

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: ${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Fetch Dependabot Metadata
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

  prune-lock:
    name: Prune Lock
    needs: metadata
    if: needs.metadata.outputs.ecosystem == 'nix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Prune Lock
        run: |
          nix develop -c just fmt
          nix flake lock
      - name: Commit
        uses: planetscale/ghcommit-action@v0.2.22
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          repo: ${{ github.repository }}
          branch: ${{ github.event.pull_request.head.ref }}
          commit_message: "flake: prune lock"
