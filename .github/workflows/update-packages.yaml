name: Update Packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  generate-matrix:
    name: Generate Update Matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
      - name: Generate Update Matrix
        id: matrix
        run: |
          # shellcheck disable=SC2016
          packages=$(nix eval --json .#packages.x86_64-linux --apply '
            packages: builtins.filter (name:
              name != "update-packages" && packages.${name} ? passthru.updateScript
            ) (builtins.attrNames packages)
          ')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  update:
    name: "Update Package: ${{ matrix.pkg }}"
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.generate-matrix.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Update Package
        id: update
        env:
          PACKAGE: ${{ matrix.pkg }}
        run: bash .github/scripts/update-package.sh "$PACKAGE"
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: packages/${{ matrix.pkg }}
          delete-branch: true
          sign-commits: true
          commit-message: >-
            packages: bump ${{ matrix.pkg }} from ${{ steps.update.outputs.before }} to ${{ steps.update.outputs.after }}
          title: >-
            packages: bump ${{ matrix.pkg }} from ${{ steps.update.outputs.before }} to ${{ steps.update.outputs.after }}
          body: ${{ steps.update.outputs.body }}
