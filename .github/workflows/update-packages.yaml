name: Update Packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  generate-matrix:
    name: Generate Update Matrix
    runs-on: ubuntu-latest
    outputs:
      updates: ${{ steps.matrix.outputs.updates }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          netrc: ${{ secrets.NETRC }}
      - name: Generate Update Matrix
        id: matrix
        run: echo "updates=$(nix eval --json .#githubActionsUpdateMatrix)" >> "$GITHUB_OUTPUT"

  update:
    name: "Update Package (${{ matrix.system }}): ${{ matrix.name }}"
    needs: generate-matrix
    runs-on: >-
      ${{ case(
        matrix.system == 'aarch64-linux', 'ubuntu-26.04-arm',
        matrix.system == 'x86_64-linux', 'ubuntu-latest',
        null
      ) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.updates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
          netrc: ${{ secrets.NETRC }}
          cachix-auth-token: >-
            ${{ (
              (github.ref == 'refs/heads/main' &&
                (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'push' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.actor)) ||
              (github.event_name == 'pull_request' &&
                contains(fromJSON('["vidhanio","vidhan-bot[bot]","dependabot[bot]"]'), github.event.pull_request.user.login))
            ) && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Update Package
        id: update
        env:
          PACKAGE: ${{ matrix.name }}
        run: bash .github/scripts/update-package.sh "$PACKAGE"
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: packages/${{ matrix.name }}
          delete-branch: true
          sign-commits: true
          commit-message: >-
            packages: bump ${{ matrix.name }} from ${{ steps.update.outputs.before }} to ${{ steps.update.outputs.after }}
          title: >-
            packages: bump ${{ matrix.name }} from ${{ steps.update.outputs.before }} to ${{ steps.update.outputs.after }}
          body: ${{ steps.update.outputs.body }}
